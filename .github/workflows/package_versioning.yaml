name: Listener PR Versioned Docker Build

on:
  repository_dispatch:
    types: [versioning-event]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    if: >
      (github.event.client_payload.base_ref == 'staging' && github.event.client_payload.head_ref == 'develop') ||
      (github.event.client_payload.base_ref == 'main' && github.event.client_payload.head_ref == 'staging')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get PR metadata from payload
        id: pr_meta
        run: |
          echo "pr_number=${{ github.event.client_payload.pr_number }}" >> $GITHUB_OUTPUT
          SHA_SHORT=$(git rev-parse --short HEAD)
          echo "pr_sha_short=${SHA_SHORT}" >> $GITHUB_OUTPUT

      - name: Calculate next version
        id: versioning
        run: |
          PACKAGE_NAME=$(basename "${{ github.event.client_payload.repo }}")
          BRANCH="${{ github.event.client_payload.base_ref }}"

          if [ "$BRANCH" = "staging" ]; then
            PREFIX="s.v"
          else
            PREFIX="p.v"
          fi

          LAST_VERSION=$(curl -s -H "Authorization: Bearer ${{ secrets.PERSONAL_ACCESS_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/packages/container/${PACKAGE_NAME}/versions" \
            | jq -r --arg PREFIX "$PREFIX" '.[].metadata.container.tags[] | select(startswith($PREFIX))' \
            | sort -V | tail -n1 | sed "s/^${PREFIX}//")

          if [ -z "$LAST_VERSION" ]; then
            NEXT_VERSION=1
          else
            NEXT_VERSION=$((LAST_VERSION + 1))
          fi

          echo "version=${NEXT_VERSION}" >> $GITHUB_OUTPUT
          echo "full_tag=${PREFIX}${NEXT_VERSION}" >> $GITHUB_OUTPUT

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.PERSONAL_ACCESS_TOKEN }}

      - name: Normalize repository info
        id: normalize
        run: |
          REPO_FULL="${{ github.event.client_payload.repo }}"
          OWNER_REAL=$(echo "${REPO_FULL}" | cut -d '/' -f1)
          OWNER_LC=$(echo "$OWNER_REAL" | tr '[:upper:]' '[:lower:]')
          REPO_LC=$(echo "${REPO_FULL}" | cut -d '/' -f2 | tr '[:upper:]' '[:lower:]')

          echo "owner_lc=${OWNER_LC}" >> $GITHUB_OUTPUT
          echo "owner_real=${OWNER_REAL}" >> $GITHUB_OUTPUT
          echo "repo=${REPO_LC}" >> $GITHUB_OUTPUT


      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.client_payload.repo }}
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          path: app

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./app
          file: ./app/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.normalize.outputs.owner }}/${{ steps.normalize.outputs.repo }}:${{ steps.versioning.outputs.full_tag }}
          labels: |
            pr=${{ steps.pr_meta.outputs.pr_number }}
            sha=${{ steps.pr_meta.outputs.pr_sha_short }}

      - name: Update PR comment
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: ${{ github.event.client_payload.pr_number }},
              owner: ${{ steps.normalize.outputs.owner_real }},
              repo: ${{ steps.normalize.outputs.repo }},
              body: `🚀 Nova versão de imagem gerada!\n` +
                    `📦 ghcr.io/${{ steps.normalize.outputs.owner_lc }}/${{ steps.normalize.outputs.repo }}:${{ steps.versioning.outputs.full_tag }}\n` +
                    `🔗 \`docker pull ghcr.io/${{ steps.normalize.outputs.owner_lc }}/${{ steps.normalize.outputs.repo }}:${{ steps.versioning.outputs.full_tag }}\``
            })
